name: Live prices
on:
  schedule:
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-prices
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy
      - run: python update_live.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add live.json
          git commit -m "Live prices" || echo "No changes"
          git pull --rebase
          git push
